name: Build Android Native Library

on:
  push:
    branches: [main, stable]
    paths:
      - 'rust/honemesh-android/**'
      - 'rust/honemesh-node/crates/**'
      - '.github/workflows/android-node.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/honemesh-android/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('rust/honemesh-android/Cargo.lock') }}

      - name: Install native build deps
        run: sudo apt-get install -y libonig-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up JDK + Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Verify NDK path
        run: |
          NDK="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK=$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$BIN" | grep -q 'aarch64-linux-android.*-clang$' || \
            (echo "aarch64 clang not found in NDK bin: $BIN"; ls "$BIN" | grep clang | head -5; exit 1)

      - name: Build arm64-v8a (phones)
        working-directory: rust/honemesh-android
        run: cargo ndk -t arm64-v8a -o jniLibs build --release

      - name: Build armeabi-v7a (older phones)
        working-directory: rust/honemesh-android
        run: cargo ndk -t armeabi-v7a -o jniLibs build --release

      - name: Build x86_64 (emulator)
        working-directory: rust/honemesh-android
        run: cargo ndk -t x86_64 -o jniLibs build --release

      - name: Copy .so files into Android jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/honemesh-android/jniLibs/arm64-v8a/libhonemesh_miner.so   android/app/src/main/jniLibs/arm64-v8a/
          cp rust/honemesh-android/jniLibs/armeabi-v7a/libhonemesh_miner.so android/app/src/main/jniLibs/armeabi-v7a/
          cp rust/honemesh-android/jniLibs/x86_64/libhonemesh_miner.so       android/app/src/main/jniLibs/x86_64/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: honemesh-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
