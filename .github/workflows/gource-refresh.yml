name: Refresh Gource Vault

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh public vault data
        run: bash scripts/gource-refresh.sh

      - name: Commit refreshed vault data
        run: |
          if git diff --quiet -- website/public/gource-data.json obsidian-public; then
            echo "No gource changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/gource-data.json obsidian-public
          git commit -m "refresh gource vault"
          git push
